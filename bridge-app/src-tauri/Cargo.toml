[package]
name = "dbstudio-bridge-app"
version = "1.0.0"
description = "Native Desktop Bridge & Execution Agent for DB Studio"
authors = ["DB Studio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all", "custom-protocol", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
