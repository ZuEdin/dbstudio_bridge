<!DOCTYPE html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DB Studio Local Bridge</title>
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-256x256.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              obsidian: '#0B0F17',
              surface: '#0F172A',
              card: '#131C31',
              cardBorder: '#1E293B'
            }
          }
        }
      }
    </script>
    <style>
      /* Sleek Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0F17;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10B981;
      }

      /* Premium Glassmorphic utilities */
      .glass-panel {
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(51, 65, 85, 0.5);
      }
      .glass-panel:hover {
        border-color: rgba(71, 85, 105, 0.8);
      }
      .glow-emerald {
        box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.15);
      }
      .glow-amber {
        box-shadow: 0 0 30px -5px rgba(245, 158, 11, 0.15);
      }
      .glow-sky {
        box-shadow: 0 0 30px -5px rgba(14, 165, 233, 0.15);
      }
      .glow-purple {
        box-shadow: 0 0 30px -5px rgba(168, 85, 247, 0.15);
      }
    </style>
  </head>
  <body class="bg-[#0B0F17] text-slate-100 antialiased selection:bg-emerald-500 selection:text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
